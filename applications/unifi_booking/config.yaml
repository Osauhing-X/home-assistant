name: UniFi Booking
version: "0.1.0"
slug: unifi_booking
description: Booking, access and room-turnover orchestration for UniFi and Home Assistant
url: https://oux.ee
arch: [amd64, aarch64]
startup: application
boot: auto
init: false
ingress: true
ingress_port: 8099
panel_icon: mdi:office-building-marker
homeassistant_api: true
auth_api: true
map:
  - addon_config:rw
options:
  port: 8099
  demo_mode: true
  supabase_url: ""
  supabase_publishable_key: ""
  unifi_protect_url: ""
  unifi_access_url: ""
  verify_tls: true
  resend_from: ""
schema:
  port: port
  demo_mode: bool
  supabase_url: str?
  supabase_publishable_key: password?
  unifi_protect_url: str?
  unifi_access_url: str?
  verify_tls: bool
  resend_from: email?
