name: RTSP standalone image acceptance
on:
  push:
    branches: [main]
    paths: ['packaging/rtsp_to_onvif/**', '.github/workflows/rtsp-standalone.yml']
  pull_request:
    paths: ['packaging/rtsp_to_onvif/**', '.github/workflows/rtsp-standalone.yml']
permissions:
  contents: read
jobs:
  image:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - run: node --test packaging/rtsp_to_onvif/*.test.mjs
      - name: Build isolated amd64 image
        run: docker build --build-arg TARGETARCH=amd64 --tag rtsp-standalone-acceptance packaging/rtsp_to_onvif
      - name: Refuse missing private addon options
        run: |
          if docker run --rm --network none rtsp-standalone-acceptance; then
            echo 'Startup should refuse missing options.'
            exit 1
          fi
      - name: Check actual image without cameras or external networking
        run: |
          trap 'docker rm --force rtsp-standalone-acceptance-test >/dev/null 2>&1 || true' EXIT
          docker run --detach --name rtsp-standalone-acceptance-test --network none --entrypoint node \
            --env NODE_ENV=test --env RTSP_ONVIF_OFFLINE_TEST=true \
            --env PASSWORD=synthetic-container-password --env HOST=127.0.0.1 \
            --env PORT=8090 --env ORIGIN=http://127.0.0.1:8090 \
            rtsp-standalone-acceptance build/index.js
          docker exec --interactive rtsp-standalone-acceptance-test node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          const origin='http://127.0.0.1:8090';
          let ready=false;
          for(let attempt=0;attempt<80;attempt++){
            try{if((await fetch(origin+'/login')).ok){ready=true;break;}}catch{}
            await new Promise(resolve=>setTimeout(resolve,100));
          }
          assert.equal(ready,true,'built image must serve its login page');
          assert.equal((await fetch(origin+'/api/cameras')).status,401);
          const response=await fetch(origin+'/login/session',{method:'POST',redirect:'manual',headers:{origin,'content-type':'application/x-www-form-urlencoded'},body:new URLSearchParams({password:'synthetic-container-password',next:'/'})});
          assert.equal(response.status,303);
          const cookie=response.headers.get('set-cookie').split(';')[0];
          assert.equal((await fetch(origin+'/api/cameras',{headers:{cookie}})).status,200);
          const connect=await fetch(origin+'/connect',{headers:{cookie}});
          assert.equal(connect.status,200);assert.match(await connect.text(),/Account linking is not enabled/);
          console.log('Isolated image login, protected API and account page passed.');
          JS
          docker exec rtsp-standalone-acceptance-test mediamtx --version
          docker exec rtsp-standalone-acceptance-test ffmpeg -version >/dev/null
