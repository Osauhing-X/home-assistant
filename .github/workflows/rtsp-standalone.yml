name: RTSP standalone image acceptance
on:
  push:
    branches: [main]
    paths: ['packaging/rtsp_to_onvif/**', '.github/workflows/rtsp-standalone.yml']
  pull_request:
    paths: ['packaging/rtsp_to_onvif/**', '.github/workflows/rtsp-standalone.yml']
permissions:
  contents: read
jobs:
  image:
    name: image-${{ matrix.arch }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - run: node --test packaging/rtsp_to_onvif/*.test.mjs
      - uses: docker/setup-qemu-action@v3
        if: matrix.arch == 'arm64'
        with:
          platforms: arm64
      - name: Build isolated image
        run: docker build --platform linux/${{ matrix.arch }} --build-arg TARGETARCH=${{ matrix.arch }} --tag rtsp-standalone-acceptance packaging/rtsp_to_onvif
      - name: Refuse missing private addon options
        run: |
          if docker run --rm --platform linux/${{ matrix.arch }} --network none rtsp-standalone-acceptance; then
            echo 'Startup should refuse missing options.'
            exit 1
          else
            test "$?" -eq 1
          fi
      - name: Check actual image without cameras or external networking
        run: |
          cleanup() {
            docker logs rtsp-standalone-acceptance-test || true
            docker inspect --format 'Exit={{.State.ExitCode}} OOM={{.State.OOMKilled}}' rtsp-standalone-acceptance-test || true
            docker rm --force rtsp-standalone-acceptance-test >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          printf '%s' '{"password":"synthetic-container-password","port":8090,"public_origin":"http://127.0.0.1:8090"}' > "$RUNNER_TEMP/rtsp-options.json"
          mkdir "$RUNNER_TEMP/rtsp-incomplete"
          touch "$RUNNER_TEMP/rtsp-incomplete/.migration-in-progress"
          if docker run --rm --platform linux/${{ matrix.arch }} --network none \
            --mount type=bind,source="$RUNNER_TEMP/rtsp-options.json",target=/data/options.json,readonly \
            --mount type=bind,source="$RUNNER_TEMP/rtsp-incomplete",target=/data/application-data/rtsp-to-onvif,readonly \
            rtsp-standalone-acceptance; then
            echo 'Startup should refuse an incomplete migration.'
            exit 1
          else
            test "$?" -eq 1
          fi
          docker run --detach --platform linux/${{ matrix.arch }} --name rtsp-standalone-acceptance-test --network none \
            --mount type=bind,source="$RUNNER_TEMP/rtsp-options.json",target=/data/options.json,readonly \
            rtsp-standalone-acceptance
          docker exec --interactive rtsp-standalone-acceptance-test node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import {writeFile} from 'node:fs/promises';
          import {createHash,randomBytes} from 'node:crypto';
          const origin='http://127.0.0.1:8090';
          let ready=false;
          for(let attempt=0;attempt<80;attempt++){
            try{if((await fetch(origin+'/login')).ok){ready=true;break;}}catch{}
            await new Promise(resolve=>setTimeout(resolve,100));
          }
          assert.equal(ready,true,'built image must serve its login page');
          assert.equal((await fetch(origin+'/api/cameras')).status,401);
          const response=await fetch(origin+'/login/session',{method:'POST',redirect:'manual',headers:{origin,'content-type':'application/x-www-form-urlencoded'},body:new URLSearchParams({password:'synthetic-container-password',next:'/'})});
          assert.equal(response.status,303);
          const cookie=response.headers.get('set-cookie').split(';')[0];
          assert.equal((await fetch(origin+'/api/cameras',{headers:{cookie}})).status,200);
          const connect=await fetch(origin+'/connect',{headers:{cookie}});
          assert.equal(connect.status,200);assert.match(await connect.text(),/Connect with Extaas Connect/);
          const state=await (await fetch(origin+'/api/connect',{headers:{cookie}})).json();
          assert.equal(state.enabled,true);assert.equal(state.status,'disconnected');
          await writeFile('/data/application-data/rtsp-to-onvif/cameras.json',JSON.stringify([{id:'synthetic',username:'owner',password:'synthetic-onvif-password',discoveryMode:'off',hq:'rtsp://127.0.0.1:1/no-camera'}]),{mode:0o600});
          const soap=(operation,date=new Date())=>{
            const nonce=randomBytes(16),created=date.toISOString(),digest=createHash('sha1').update(Buffer.concat([nonce,Buffer.from(created),Buffer.from('synthetic-onvif-password')])).digest('base64');
            return `<s:Envelope><s:Header><UsernameToken><Username>owner</Username><Password Type="http://docs.oasis-open.org/wss/2004/01/oasis-200401-wss-username-token-profile-1.0#PasswordDigest">${digest}</Password><Nonce>${nonce.toString('base64')}</Nonce><Created>${created}</Created></UsernameToken></s:Header><s:Body><${operation}/></s:Body></s:Envelope>`;
          };
          for(const path of ['/onvif/device_service','/onvif/synthetic/device_service','/onvif/media_service','/onvif/synthetic/media_service']){
            const operation=path.includes('media_service')?'GetSnapshotUri':'GetUsers',body=soap(operation);
            const send=body=>fetch(origin+path,{method:'POST',headers:{'content-type':'application/soap+xml'},body});
            assert.equal((await send(body)).status,200);
            assert.equal((await send(body)).status,401);
            assert.equal((await send(soap(operation,new Date(Date.now()-360000)))).status,401);
          }
          assert.equal((await fetch(origin+'/onvif/media_service',{method:'POST',headers:{'content-type':'application/soap+xml'},body:'x'.repeat(65537)})).status,413);
          const login=password=>fetch(origin+'/login?next=%2Fconnect',{method:'POST',redirect:'manual',headers:{origin,accept:'text/html','content-type':'application/x-www-form-urlencoded'},body:new URLSearchParams({password,next:'/connect'})});
          const native=await login('synthetic-container-password');assert.equal(native.status,303);assert.equal(native.headers.get('location'),'/connect');
          for(let attempt=0;attempt<8;attempt++){
            const failed=await login('synthetic-wrong');assert.equal(failed.status,attempt===7?429:400);
            const html=await failed.text();assert.doesNotMatch(html,/synthetic-wrong/);
            if(attempt===7){assert.match(html,/Too many attempts/);assert.match(failed.headers.get('retry-after'),/^\d+$/);}
          }
          assert.equal((await login('synthetic-container-password')).status,429);
          assert.equal((await fetch(origin+'/api/cameras',{headers:{cookie}})).status,200);
          console.log('Isolated image login, protected API and account page passed.');
          JS
          docker exec rtsp-standalone-acceptance-test mediamtx --version
          docker exec rtsp-standalone-acceptance-test ffmpeg -version >/dev/null
          docker exec rtsp-standalone-acceptance-test sh -c 'command -v ip && command -v udhcpc && command -v ffprobe'
          docker stop --time 20 rtsp-standalone-acceptance-test
          test "$(docker inspect --format '{{.State.ExitCode}}' rtsp-standalone-acceptance-test)" -eq 0
